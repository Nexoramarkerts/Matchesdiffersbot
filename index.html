<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PAIRTRADE AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090511;
  color:#fff;
  font-family:Arial,sans-serif;
}

.header{
  height:58px;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#160b25;
  border-bottom:1px solid #41205a;
}

.logo{
  color:#c77dff;
  font-size:20px;
  font-weight:bold;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:10px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#777;
}

.dot.green{
  background:#20e56a;
  box-shadow:0 0 8px #20e56a;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:12px;
}

.card{
  background:#12091c;
  border:1px solid #3d1d53;
  border-radius:12px;
  padding:13px;
  margin-bottom:11px;
}

.title{
  color:#c77dff;
  font-size:13px;
  font-weight:bold;
  margin-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

label{
  display:block;
  color:#999;
  font-size:10px;
  margin-bottom:4px;
}

input,
select,
button{
  width:100%;
  border:1px solid #4a2364;
  border-radius:8px;
  background:#0a0510;
  color:#fff;
  padding:10px;
  font-size:12px;
  outline:none;
}

button{
  background:#7625b2;
  border:none;
  font-weight:bold;
}

button:hover{
  background:#9137d0;
}

button.stop{
  background:#98283c;
}

button.secondary{
  background:#30143f;
}

.row{
  display:flex;
  gap:8px;
}

.row>*{
  flex:1;
}

.hidden{
  display:none!important;
}

.info{
  background:#0b0610;
  border:1px solid #321744;
  border-radius:8px;
  padding:9px;
  font-size:11px;
  color:#aaa;
}

.big{
  font-size:20px;
  font-weight:bold;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.stat{
  background:#0a0510;
  border-radius:8px;
  padding:9px;
  text-align:center;
}

.green{
  color:#20e56a;
}

.red{
  color:#ff506d;
}

.purple{
  color:#c77dff;
}

.small{
  font-size:10px;
  color:#777;
  margin-top:5px;
}

.tickbox{
  background:#08040d;
  border-radius:8px;
  padding:9px;
  max-height:140px;
  overflow:auto;
  font-family:monospace;
  font-size:10px;
}

.pairPreview{
  background:#0a0510;
  border:1px solid #4a2364;
  border-radius:9px;
  padding:11px;
  margin-top:10px;
  text-align:center;
}

.pairName{
  color:#c77dff;
  font-size:15px;
  font-weight:bold;
}

.barrierValue{
  font-size:22px;
  font-weight:bold;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">PAIRTRADE AI</div>

  <div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">DISCONNECTED</span>
  </div>
</div>


<div class="container">

<!-- CONNECTION -->

<div class="card">

  <div class="title">DERIV CONNECTION</div>

  <div class="grid">

    <div>
      <label>APP ID</label>
      <input id="appId" placeholder="App ID">
    </div>

    <div>
      <label>PAT</label>
      <input id="pat" type="password" placeholder="PAT">
    </div>

  </div>

  <br>

  <div class="row">

    <button onclick="connectAccount()">CONNECT</button>

    <button class="secondary" onclick="findAccount('demo')">
      FIND DEMO
    </button>

    <button class="secondary" onclick="findAccount('real')">
      FIND REAL
    </button>

  </div>

  <div id="connectionMessage" class="small"></div>

</div>


<!-- ACCOUNT -->

<div class="card">

  <div class="title">ACCOUNT</div>

  <div class="grid">

    <div>
      <label>ACCOUNT</label>
      <div id="accountId" class="big">—</div>
    </div>

    <div>
      <label>BALANCE</label>
      <div id="balance" class="big">$0.00</div>
    </div>

  </div>

</div>


<!-- MARKET -->

<div class="card">

  <div class="title">MARKET</div>

  <div class="grid">

    <div>

      <label>MARKET</label>

      <select id="market">

        <option value="volatility">
          Volatilities
        </option>

        <option value="volatility1s">
          Volatility 1s
        </option>

      </select>

    </div>


    <div>

      <label>SYMBOL</label>

      <select id="symbol">

        <option value="">
          Connect first
        </option>

      </select>

    </div>

  </div>

</div>


<!-- TRADE TYPE -->

<div class="card">

  <div class="title">TRADE TYPE</div>

  <div class="grid">

    <div>

      <label>TRADE TYPE</label>

      <select id="tradeType">

        <option value="digits">
          Digits
        </option>

        <option value="updown">
          Up / Down
        </option>

      </select>

    </div>


    <div>

      <label>CONTRACT PAIR</label>

      <select id="pairType">

        <option value="matchdiff">
          Matches / Differs
        </option>

        <option value="evenodd">
          Even / Odd
        </option>

        <option value="overunder">
          Over / Under
        </option>

        <option value="updown">
          Rise / Fall
        </option>

      </select>

    </div>

  </div>


  <!-- MATCHES / DIFFERS -->

  <div id="matchSettings">

    <br>

    <div class="grid">

      <div>

        <label>AUTO MATCH BARRIER</label>

        <select id="autoMatch">

          <option value="on">
            ON
          </option>

          <option value="off">
            OFF
          </option>

        </select>

      </div>


      <div>

        <label>MATCH / DIFFER DIGIT</label>

        <input
          id="matchBarrier"
          type="number"
          min="0"
          max="9"
          value="5"
        >

      </div>

    </div>

  </div>


  <!-- OVER / UNDER -->

  <div id="overUnderSettings" class="hidden">

    <br>

    <div class="grid">

      <div>

        <label>UNDER BARRIER</label>

        <input
          id="underBarrier"
          type="number"
          min="0"
          max="9"
          value="6"
        >

      </div>


      <div>

        <label>OVER BARRIER</label>

        <input
          id="overBarrier"
          type="number"
          min="0"
          max="9"
          value="3"
        >

      </div>

    </div>

    <div class="small">
      Example: UNDER 6 + OVER 3
    </div>

  </div>


  <!-- PAIR PREVIEW -->

  <div class="pairPreview">

    <div id="pairName" class="pairName">
      MATCHES VS DIFFERS
    </div>

    <div id="pairDescription" class="small">
      Same digit barrier will be used for both legs.
    </div>

    <div id="barrierPreview" class="barrierValue">
      AUTO
    </div>

  </div>

</div>


<!-- TRADING SETTINGS -->

<div class="card">

  <div class="title">TRADING SETTINGS</div>

  <div class="grid">

    <div>

      <label>STAKE / LEG</label>

      <input
        id="stake"
        type="number"
        min="0.35"
        step="0.01"
        value="0.50"
      >

    </div>


    <div>

      <label>DURATION / TICKS</label>

      <input
        id="duration"
        type="number"
        min="1"
        max="100"
        value="1"
      >

    </div>


    <div>

      <label>LOOKBACK TICKS</label>

      <input
        id="lookback"
        type="number"
        min="5"
        max="100"
        value="25"
      >

    </div>


    <div>

      <label>MIN STRENGTH %</label>

      <input
        id="strength"
        type="number"
        min="1"
        max="100"
        value="15"
      >

    </div>

  </div>

  <br>

  <div class="row">

    <button onclick="startBot()">
      START
    </button>

    <button class="stop" onclick="stopBot()">
      STOP
    </button>

    <button class="secondary" onclick="resetRuns()">
      RESET RUNS
    </button>

  </div>

</div>


<!-- STATS -->

<div class="card">

  <div class="title">RUNS</div>

  <div class="stats">

    <div class="stat">
      <label>PAIRS</label>
      <div id="runs" class="purple">0</div>
    </div>

    <div class="stat">
      <label>WINS</label>
      <div id="wins" class="green">0</div>
    </div>

    <div class="stat">
      <label>LOSSES</label>
      <div id="losses" class="red">0</div>
    </div>

    <div class="stat">
      <label>WIN RATE</label>
      <div id="winrate">0%</div>
    </div>

  </div>

</div>


<!-- LIVE -->

<div class="card">

  <div class="title">LIVE MARKET</div>

  <div class="grid">

    <div>

      <label>CURRENT DIGIT</label>

      <div id="currentDigit"
           class="big purple">
        —
      </div>

    </div>


    <div>

      <label>ANALYSIS</label>

      <div id="analysis">
        Waiting for ticks...
      </div>

    </div>

  </div>

  <br>

  <div id="tickList" class="tickbox">
    Waiting for live ticks...
  </div>

</div>


<!-- ACTIVITY -->

<div class="card">

  <div class="title">ACTIVITY</div>

  <div id="log" class="tickbox"></div>

</div>

</div>


<script>

/* =====================================================
   GLOBALS
===================================================== */

let ws = null;

let appID = "";
let PAT = "";

let selectedAccount = null;

let symbols = [];

let ticks = [];

let running = false;

let runs = 0;
let wins = 0;
let losses = 0;

let reqId = 1000;

let pendingProposals = {};

let activePairs = {};

let pairSequence = 0;

let accountCurrency = "USD";

let availableContracts = {};


/* =====================================================
   HELPERS
===================================================== */

const $ = id =>
  document.getElementById(id);


function log(message){

  const box = $("log");

  const time =
    new Date().toLocaleTimeString();

  box.innerHTML =
    `[${time}] ${message}<br>` +
    box.innerHTML;
}


function send(data){

  if(
    ws &&
    ws.readyState === WebSocket.OPEN
  ){

    ws.send(JSON.stringify(data));

    return true;

  }

  return false;
}


function nextReq(){

  return ++reqId;

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(connected){

  $("statusDot").className =
    connected
      ? "dot green"
      : "dot";

  $("statusText").textContent =
    connected
      ? "CONNECTED"
      : "DISCONNECTED";

}


/* =====================================================
   ACCOUNT
===================================================== */

async function connectAccount(){

  appID =
    $("appId").value.trim();

  PAT =
    $("pat").value.trim();

  if(!appID || !PAT){

    $("connectionMessage").textContent =
      "Enter App ID and PAT.";

    return;

  }

  await findAccount(null);

}


async function findAccount(type){

  if(!appID)
    appID = $("appId").value.trim();

  if(!PAT)
    PAT = $("pat").value.trim();

  if(!appID || !PAT){

    alert("Enter App ID and PAT first.");

    return;

  }

  $("connectionMessage").textContent =
    "Finding Deriv account...";


  try{

    const response =
      await fetch(
        "https://api.derivws.com/trading/v1/options/accounts",
        {
          headers:{
            "Authorization":
              "Bearer " + PAT,

            "Deriv-App-ID":
              appID
          }
        }
      );


    const json =
      await response.json();


    if(!response.ok){

      throw new Error(
        json.message ||
        "Account lookup failed."
      );

    }


    const accounts =
      json.data ||
      json.accounts ||
      [];


    if(!accounts.length){

      throw new Error(
        "No Deriv accounts found."
      );

    }


    let account;


    if(type){

      account =
        accounts.find(a => {

          const value =
            String(
              a.account_type ||
              a.type ||
              a.environment ||
              ""
            ).toLowerCase();

          return value.includes(type);

        });

    }


    account =
      account ||
      accounts[0];


    selectedAccount =
      account;


    await requestOTP(account);


  }catch(error){

    $("connectionMessage").textContent =
      error.message;

    log(
      "ACCOUNT ERROR: " +
      error.message
    );

  }

}


/* =====================================================
   OTP
===================================================== */

async function requestOTP(account){

  const accountId =
    account.id ||
    account.account_id ||
    account.loginid;


  if(!accountId){

    throw new Error(
      "Account ID missing."
    );

  }


  const response =
    await fetch(
      "https://api.derivws.com/trading/v1/options/accounts/" +
      encodeURIComponent(accountId) +
      "/otp",
      {
        method:"POST",

        headers:{
          "Authorization":
            "Bearer " + PAT,

          "Deriv-App-ID":
            appID,

          "Content-Type":
            "application/json"
        }
      }
    );


  const json =
    await response.json();


  if(!response.ok){

    throw new Error(
      json.message ||
      "OTP request failed."
    );

  }


  const url =
    json.data?.url ||
    json.url;


  if(!url){

    throw new Error(
      "Deriv WebSocket URL missing."
    );

  }


  connectWebSocket(
    url,
    accountId
  );

}


/* =====================================================
   WEBSOCKET
===================================================== */

function connectWebSocket(
  url,
  accountId
){

  if(ws){

    try{
      ws.close();
    }catch(e){}

  }


  ws =
    new WebSocket(url);


  ws.onopen = () => {

    setStatus(true);

    $("accountId").textContent =
      accountId;

    $("connectionMessage").textContent =
      "Connected to Deriv.";

    log("CONNECTED.");


    send({
      active_symbols:"brief",
      req_id:nextReq()
    });


    send({
      balance:1,
      subscribe:1,
      req_id:nextReq()
    });

  };


  ws.onmessage = event => {

    let data;

    try{

      data =
        JSON.parse(event.data);

    }catch(e){

      return;

    }


    handleMessage(data);

  };


  ws.onerror = () => {

    setStatus(false);

    log("WEBSOCKET ERROR.");

  };


  ws.onclose = () => {

    setStatus(false);

    log("DISCONNECTED.");

  };

}


/* =====================================================
   MESSAGE ROUTER
===================================================== */

function handleMessage(data){

  if(data.error){

    log(
      "DERIV ERROR: " +
      (
        data.error.message ||
        "Unknown error"
      )
    );

    /*
      If this error belongs to a proposal,
      don't leave the pair waiting forever.
    */

    if(
      data.echo_req &&
      data.echo_req.req_id
    ){

      const pending =
        pendingProposals[
          data.echo_req.req_id
        ];

      if(pending){

        handleProposalError(
          pending,
          data.error.message
        );

      }

    }

    return;

  }


  if(
    data.msg_type ===
    "active_symbols"
  ){

    loadSymbols(
      data.active_symbols ||
      []
    );

    return;

  }


  if(
    data.msg_type ===
    "balance"
  ){

    if(
      data.balance &&
      data.balance.balance !== undefined
    ){

      accountCurrency =
        data.balance.currency ||
        accountCurrency;


      $("balance").textContent =
        Number(
          data.balance.balance
        ).toFixed(2) +
        " " +
        accountCurrency;

    }

    return;

  }


  if(
    data.msg_type ===
    "tick"
  ){

    processTick(
      data.tick
    );

    return;

  }


  if(
    data.msg_type ===
    "contracts_for"
  ){

    handleContractsFor(data);

    return;

  }


  if(
    data.msg_type ===
    "proposal"
  ){

    handleProposal(data);

    return;

  }


  if(
    data.msg_type ===
    "buy"
  ){

    handleBuy(data);

    return;

  }


  if(
    data.msg_type ===
    "proposal_open_contract"
  ){

    handleOpenContract(data);

    return;

  }

}


/* =====================================================
   SYMBOLS
===================================================== */

function loadSymbols(list){

  symbols =
    Array.isArray(list)
      ? list
      : [];


  populateSymbolDropdown();

}


function populateSymbolDropdown(){

  const market =
    $("market").value;


  const select =
    $("symbol");


  select.innerHTML = "";


  let filtered =
    symbols.filter(s => {

      const code =
        s.underlying_symbol ||
        s.symbol ||
        "";


      const name =
        s.underlying_symbol_name ||
        s.display_name ||
        "";


      const text =
        (
          name +
          " " +
          code
        ).toLowerCase();


      if(
        market ===
        "volatility"
      ){

        return (
          (
            text.includes(
              "volatility"
            ) ||
            /^r_\d+$/i.test(code)
          )
          &&
          !code.startsWith("1HZ")
          &&
          !text.includes("1s")
        );

      }


      if(
        market ===
        "volatility1s"
      ){

        return (
          code.startsWith("1HZ") ||
          text.includes("1s")
        );

      }


      return false;

    });


  const seen =
    new Set();


  filtered =
    filtered.filter(s => {

      const code =
        s.underlying_symbol ||
        s.symbol;

      if(!code || seen.has(code))
        return false;

      seen.add(code);

      return true;

    });


  filtered.sort(
    volatilitySort
  );


  if(!filtered.length){

    addFallbackSymbols(
      market
    );

    return;

  }


  filtered.forEach(s => {

    const code =
      s.underlying_symbol ||
      s.symbol;


    const name =
      s.underlying_symbol_name ||
      s.display_name ||
      code;


    const option =
      document.createElement(
        "option"
      );


    option.value =
      code;


    option.textContent =
      cleanName(
        name,
        code
      );


    select.appendChild(
      option
    );

  });


  if(select.value){

    ticks = [];

    subscribeTicks(
      select.value
    );

    requestContractsFor(
      select.value
    );

  }


  log(
    filtered.length +
    " volatility symbols loaded."
  );

}


function volatilitySort(a,b){

  const ac =
    a.underlying_symbol ||
    a.symbol ||
    "";

  const bc =
    b.underlying_symbol ||
    b.symbol ||
    "";


  const an =
    parseInt(
      (
        ac.match(/\d+/) ||
        ["999"]
      )[0]
    );


  const bn =
    parseInt(
      (
        bc.match(/\d+/) ||
        ["999"]
      )[0]
    );


  return an - bn;

}


function addFallbackSymbols(
  market
){

  const select =
    $("symbol");


  const list =
    market === "volatility"
      ? [
          ["R_10","Volatility 10"],
          ["R_25","Volatility 25"],
          ["R_50","Volatility 50"],
          ["R_75","Volatility 75"],
          ["R_100","Volatility 100"]
        ]
      : [
          ["1HZ10V","Volatility 10 1s"],
          ["1HZ25V","Volatility 25 1s"],
          ["1HZ50V","Volatility 50 1s"],
          ["1HZ75V","Volatility 75 1s"],
          ["1HZ100V","Volatility 100 1s"]
        ];


  list.forEach(item => {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      item[0];

    option.textContent =
      item[1];

    select.appendChild(
      option
    );

  });


  if(select.value){

    subscribeTicks(
      select.value
    );

    requestContractsFor(
      select.value
    );

  }

}


function cleanName(
  name,
  code
){

  const known = {

    "R_10":
      "Volatility 10",

    "R_25":
      "Volatility 25",

    "R_50":
      "Volatility 50",

    "R_75":
      "Volatility 75",

    "R_100":
      "Volatility 100",

    "1HZ10V":
      "Volatility 10 1s",

    "1HZ25V":
      "Volatility 25 1s",

    "1HZ50V":
      "Volatility 50 1s",

    "1HZ75V":
      "Volatility 75 1s",

    "1HZ100V":
      "Volatility 100 1s",

    "1HZ15V":
      "Volatility 15 1s",

    "1HZ30V":
      "Volatility 30 1s",

    "1HZ90V":
      "Volatility 90 1s"

  };


  return (
    known[code] ||
    name ||
    code
  );

}


/* =====================================================
   MARKET CHANGE
===================================================== */

$("market").addEventListener(
  "change",
  () => {

    ticks = [];

    $("symbol").innerHTML =
      "<option>Loading...</option>";


    if(
      ws &&
      ws.readyState ===
      WebSocket.OPEN
    ){

      send({
        active_symbols:"brief",
        req_id:nextReq()
      });

    }

  }
);


/* =====================================================
   SYMBOL CHANGE
===================================================== */

$("symbol").addEventListener(
  "change",
  () => {

    ticks = [];

    const symbol =
      $("symbol").value;


    if(symbol){

      subscribeTicks(
        symbol
      );

      requestContractsFor(
        symbol
      );

    }

  }
);


/* =====================================================
   TICKS
===================================================== */

function subscribeTicks(
  symbol
){

  if(
    !ws ||
    ws.readyState !==
    WebSocket.OPEN
  ){

    return;

  }


  send({
    ticks:symbol,
    subscribe:1,
    req_id:nextReq()
  });


  log(
    "LIVE TICKS: " +
    symbol
  );

}


function processTick(tick){

  if(!tick)
    return;


  const quote =
    Number(
      tick.quote
    );


  const digit =
    getLastDigit(
      quote
    );


  ticks.push({

    quote:quote,

    digit:digit,

    epoch:
      tick.epoch

  });


  const lookback =
    Number(
      $("lookback").value
    ) || 25;


  if(
    ticks.length >
    lookback
  ){

    ticks.shift();

  }


  $("currentDigit")
    .textContent =
    digit;


  updateTicks();

  analyze();

}


function getLastDigit(
  price
){

  const str =
    String(price);


  const digits =
    str.replace(
      /\D/g,
      ""
    );


  return Number(
    digits.charAt(
      digits.length - 1
    )
  );

}


function updateTicks(){

  $("tickList")
    .innerHTML =

        .slice()
        .reverse()
        .map(

        )
        .join("<br>");

}


/* =====================================================
   ANALYSIS
===================================================== */

function analyze(){

  if(
    ticks.length < 5
  ){

    $("analysis")
      .textContent =
      "Collecting ticks...";

    return null;

  }


  const counts =
    Array(10).fill(0);


  ticks.forEach(t => {

    counts[
      t.digit
    ]++;

  });


  let digit = 0;


  for(
    let i=1;
    i<10;
    i++
  ){

    if(
      counts[i] >
      counts[digit]
    ){

      digit = i;

    }

  }


  const strength =
    (
      counts[digit] /
      ticks.length
    ) * 100;


  $("analysis")
    .innerHTML =
    `Dominant digit:
     <b>${digit}</b>
     |
     Strength:
     <b>${strength.toFixed(1)}%</b>`;


  return {

    digit:digit,

    strength:strength,

    counts:counts

  };

}

/* =====================================================

/* =====================================================
   BUILD PAIR
===================================================== */

function buildPair(){

  const pair =
    $("pairType").value;


  /*
    MATCHES / DIFFERS
  */

  if(pair === "matchdiff"){

    let barrier =
      Number(
        $("matchBarrier").value
      );


    if(
      $("autoMatch").value === "on"
    ){

      const result =
        analyze();


      if(!result)
        return null;


      const minStrength =
        Number(
          $("strength").value
        ) || 15;


      if(
        result.strength <
        minStrength
      ){

        return null;

      }


      barrier =
        result.digit;

    }


    if(
      barrier < 0 ||
      barrier > 9
    ){

      return null;

    }


    return {

      name:
        "MATCHES VS DIFFERS",

      legs:[

        {
          type:"DIGITMATCH",
          barrier:String(
            barrier
          )
        },

        {
          type:"DIGITDIFF",
          barrier:String(
            barrier
          )
        }

      ]

    };

  }


  /*
    EVEN / ODD
  */

  if(pair === "evenodd"){

    return {

      name:
        "EVEN VS ODD",

      legs:[

        {
          type:"DIGITEVEN"
        },

        {
          type:"DIGITODD"
        }

      ]

    };

  }


  /*
    OVER / UNDER
  */

  if(pair === "overunder"){

    const over =
      Number(
        $("overBarrier").value
      );


    const under =
      Number(
        $("underBarrier").value
      );


    if(
      over < 0 ||
      over > 9 ||
      under < 0 ||
      under > 9
    ){

      return null;

    }


    return {

      name:
        "OVER VS UNDER",

      legs:[

        {
          type:"DIGITOVER",
          barrier:String(over)
        },

        {
          type:"DIGITUNDER",
          barrier:String(under)
        }

      ]

    };

  }


  /*
    RISE / FALL
  */

  if(pair === "updown"){

    return {

      name:
        "RISE VS FALL",

      legs:[

        {
          type:"CALL"
        },

        {
          type:"PUT"
        }

      ]

    };

  }


  return null;

}

/* =====================================================
   TRY START PAIR
===================================================== */

function tryStartPair(){

  if(!running)
    return;


  /*
    Do not open another pair
    while an existing pair is active.
  */

  if(
    Object.keys(
      activePairs
    ).length > 0
  ){

    return;

  }


  const pair =
    buildPair();


  if(!pair){

    return;

  }


  const symbol =
    $("symbol").value;


  const duration =
    Number(
      $("duration").value
    ) || 1;


  const stake =
    Number(
      $("stake").value
    ) || 0.50;


  const pairId =
    "PAIR_" +
    (++pairSequence);


  activePairs[pairId] = {

    id:pairId,

    name:pair.name,

    symbol:symbol,

    duration:duration,

    stake:stake,

    legs:pair.legs,

    contracts:[],

    closed:0,

    totalProfit:0

  };


  runs++;

  updateStats();


  log(
    pair.name +
    " → preparing 2 contracts."
  );


  /*
    Send BOTH proposals immediately.
    Each proposal contains its own
    contract type/barrier.
  */

  pair.legs.forEach(
    (leg,index) => {

      requestProposal(
        pairId,
        index,
        leg,
        symbol,
        duration,
        stake
      );

    }
  );

}


/* =====================================================
   PROPOSAL
===================================================== */

function requestProposal(
  pairId,
  legIndex,
  leg,
  symbol,
  duration,
  stake
){

  const id =
    nextReq();


  const request = {

    proposal:1,

    amount:stake,

    basis:"stake",

    contract_type:
      leg.type,

    currency:
      accountCurrency,

    duration:
      duration,

    duration_unit:
      "t",

    underlying_symbol:
      symbol,

    req_id:
      id,

    subscribe:1

  };


  /*
    ONLY barrier contracts get
    a barrier field.
  */

  if(
    leg.type ===
    "DIGITMATCH" ||

    leg.type ===
    "DIGITDIFF" ||

    leg.type ===
    "DIGITOVER" ||

    leg.type ===
    "DIGITUNDER"
  ){

    request.barrier =
      String(
        leg.barrier
      );

  }


  pendingProposals[id] = {

    pairId:pairId,

    legIndex:legIndex,

    request:request,

    bought:false

  };


  send(request);


  log(
    `${leg.type}` +
    (
      leg.barrier !== undefined
        ? ` barrier ${leg.barrier}`
        : ""
    ) +
    " → proposal"
  );

}


/* =====================================================
   PROPOSAL RESPONSE
===================================================== */

function handleProposal(
  data
){

  const reqId =
    data.echo_req?.req_id;


  const pending =
    pendingProposals[
      reqId
    ];


  if(!pending)
    return;


  const proposal =
    data.proposal;


  if(!proposal)
    return;


  /*
    Ignore later subscription
    updates after this proposal
    has already been bought.
  */

  if(pending.bought)
    return;


  const proposalId =
    proposal.id;


  if(!proposalId){

    log(
      "Proposal returned without ID."
    );

    return;

  }


  const ask =
    Number(
      proposal.ask_price
    );


  if(
    !Number.isFinite(ask) ||
    ask <= 0
  ){

    log(
      "Invalid proposal price."
    );

    return;

  }


  pending.bought = true;


  send({

    buy:
      proposalId,

    price:
      ask,

    req_id:
      nextReq()

  });


  /*
    Store mapping for the buy response.
    We identify it using proposal ID.
  */

  pending.proposalId =
    proposalId;


  log(
    `BUY ${pending.legIndex + 1}/2 ` +
    `${pending.request.contract_type}` +
    (
      pending.request.barrier !== undefined
        ? ` barrier ${pending.request.barrier}`
        : ""
    )
  );

}


/* =====================================================
   PROPOSAL ERROR
===================================================== */

function handleProposalError(
  pending,
  message
){

  log(
    "PROPOSAL FAILED: " +
    message
  );


  const pair =
    activePairs[
      pending.pairId
    ];


  if(pair){

    delete activePairs[
      pending.pairId
    ];

  }

}


/* =====================================================
   BUY RESPONSE
===================================================== */

function handleBuy(data){

  const contract =
    data.buy;


  if(!contract){

    log(
      "BUY response missing contract."
    );

    return;

  }


  const contractId =
    contract.contract_id ||
    contract.id;


  if(!contractId){

    log(
      "Contract ID missing."
    );

    return;

  }


  /*
    Find which pending proposal
    produced this buy.

    The new API echo_req contains
    the buy request, so we use the
    closest outstanding proposal.
  */

  let found = null;


  Object.values(
    pendingProposals
  ).forEach(p => {

    if(
      !found &&
      p.bought &&
      !p.contractId
    ){

      found = p;

    }

  });


  if(!found){

    log(
      "Could not map bought contract."
    );

    return;

  }


  found.contractId =
    contractId;


  const pair =
    activePairs[
      found.pairId
    ];


  if(!pair)
    return;


  pair.contracts.push({

    id:contractId,

    legIndex:
      found.legIndex,

    type:
      found.request.contract_type,

    barrier:
      found.request.barrier,

    closed:false,

    profit:0

  });


  log(
    "CONTRACT BOUGHT: " +
    contractId
  );


  /*
    Subscribe to the actual contract.
  */

  send({

    proposal_open_contract:1,

    contract_id:
      contractId,

    subscribe:1,

    req_id:
      nextReq()

  });


  /*
    When both contracts have been
    purchased, show the pair status.
  */

  if(
    pair.contracts.length === 2
  ){

    log(
      "PAIR PURCHASE COMPLETE: " +
      pair.name
    );

  }

}


/* =====================================================
   OPEN CONTRACT
===================================================== */

function handleOpenContract(
  data
){

  const c =
    data.proposal_open_contract;


  if(!c)
    return;


  const contractId =
    c.contract_id;


  let pair = null;

  let leg = null;


  Object.values(
    activePairs
  ).forEach(p => {

    const found =
      p.contracts.find(
        x =>
          String(x.id) ===
          String(contractId)
      );


    if(found){

      pair = p;
      leg = found;

    }

  });


  if(!pair || !leg)
    return;


  const profit =
    Number(
      c.profit || 0
    );


  leg.profit =
    profit;


  /*
    Contract is finished.
  */

  const isSold =
    c.is_sold === 1 ||
    c.is_sold === true;


  const status =
    String(
      c.status || ""
    ).toLowerCase();


  const closed =
    isSold ||
    status === "won" ||
    status === "lost" ||
    status === "sold";


  if(!closed)
    return;


  if(leg.closed)
    return;


  leg.closed = true;

  pair.closed++;

  pair.totalProfit +=
    profit;


  log(
    `${leg.type} CLOSED | ` +
    `Profit: ${profit.toFixed(2)}`
  );


  /*
    Both legs have now closed.
  */

  if(
    pair.closed >= 2
  ){

    finishPair(
      pair
    );

  }

}


/* =====================================================
   FINISH PAIR
===================================================== */

function finishPair(pair){

  const total =
    pair.totalProfit;


  if(total > 0){

    wins++;

    log(
      `PAIR WON | TOTAL P/L: ` +
      `${total.toFixed(2)}`
    );

  }else{

    losses++;

    log(
      `PAIR LOSS | TOTAL P/L: ` +
      `${total.toFixed(2)}`
    );

  }


  updateStats();


  delete activePairs[
    pair.id
  ];


  /*
    Clean proposal mappings
    belonging to this pair.
  */

  Object.keys(
    pendingProposals
  ).forEach(key => {

    if(
      pendingProposals[key]
        .pairId ===
      pair.id
    ){

      delete pendingProposals[key];

    }

  });


  /*
    Start looking for the next
    setup only after BOTH contracts
    have closed.
  */

  if(running){

    setTimeout(
      tryStartPair,
      300
    );

  }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  $("runs").textContent =
    runs;


  $("wins").textContent =
    wins;


  $("losses").textContent =
    losses;


  const rate =
    runs > 0
      ? (
          wins /
          runs
        ) * 100
      : 0;


  $("winrate").textContent =
    rate.toFixed(1) +
    "%";

}


function resetRuns(){

  /*
    Do not interfere with an
    open pair.
  */

  if(
    Object.keys(
      activePairs
    ).length
  ){

    log(
      "Close the active pair before resetting runs."
    );

    return;

  }


  runs = 0;

  wins = 0;

  losses = 0;

  updateStats();

  log(
    "RUN COUNTER RESET."
  );

}


/* =====================================================
   AUTO START ON QUALIFYING TICK
===================================================== */

let lastAttemptTick = 0;


function autoEntryCheck(){

  if(!running)
    return;


  if(
    Object.keys(
      activePairs
    ).length
  ){

    return;

  }


  if(
    ticks.length <
    5
  ){

    return;

  }


  const currentEpoch =
    ticks[
      ticks.length - 1
    ].epoch;


  if(
    currentEpoch ===
    lastAttemptTick
  ){

    return;

  }


  lastAttemptTick =
    currentEpoch;


  tryStartPair();

}


/*
  Replace the normal tick analysis
  call with analysis + entry check.
*/

const originalProcessTick =
  processTick;


/*
  We cannot redeclare processTick,
  so entry check is called here
  through the tick-list listener.
*/

setInterval(
  autoEntryCheck,
  250
);


/* =====================================================
   INITIAL UI
===================================================== */

updateContractUI();

updatePairPreview();

updateStats();
