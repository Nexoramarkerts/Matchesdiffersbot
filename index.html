<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NESTER Paired Digit Bot</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#070b12;
  color:#f5f7fa;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  width:min(760px,94%);
  margin:20px auto;
}

.card{
  background:#0e141e;
  border:1px solid #202a38;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

h1{
  margin:0 0 5px;
  font-size:25px;
}

.subtitle{
  color:#8995a7;
  font-size:13px;
}

label{
  display:block;
  color:#9eabbc;
  font-size:12px;
  margin:13px 0 6px;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #273344;
  background:#080d14;
  color:white;
  outline:none;
}

button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
  background:#1d8cff;
  color:white;
}

button.secondary{
  background:#182333;
}

button.danger{
  background:#b52d3b;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.statgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#080d14;
  border:1px solid #202b39;
  border-radius:12px;
  padding:12px;
}

.stat-title{
  color:#8491a4;
  font-size:11px;
}

.stat-value{
  font-size:21px;
  font-weight:bold;
  margin-top:5px;
}

.target{
  text-align:center;
  padding:18px;
  background:#080d14;
  border:1px solid #263346;
  border-radius:15px;
  margin-top:14px;
}

.target-title{
  color:#8d99aa;
  font-size:12px;
}

.target-value{
  font-size:48px;
  font-weight:800;
  margin-top:5px;
}

.status{
  padding:10px 12px;
  background:#080d14;
  border-radius:10px;
  border:1px solid #202b39;
  margin-top:10px;
  font-size:13px;
}

.log{
  height:230px;
  overflow-y:auto;
  background:#05080d;
  border-radius:12px;
  padding:10px;
  font-family:monospace;
  font-size:11px;
  line-height:1.55;
  white-space:pre-wrap;
}

.win{
  color:#37d889;
}

.loss{
  color:#ff6674;
}

.muted{
  color:#7f8a9a;
}

.signature{
  text-align:center;
  color:#697587;
  font-size:12px;
  padding:10px 0 20px;
}

.accountBox{
  background:#080d14;
  border:1px solid #202b39;
  border-radius:12px;
  padding:10px;
  margin-top:10px;
  font-size:12px;
}

@media(max-width:600px){
  .grid,
  .statgrid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>Paired Digit Bot</h1>
    <div class="subtitle">
      Match/Differ + Even/Odd • 1 Tick
    </div>

    <label>Deriv App ID</label>
    <input id="appId" value="34vI680tGB2gqo6WEMsRZ">

    <label>Personal Access Token (PAT)</label>
    <input id="pat" type="password" placeholder="Paste your PAT here">

    <button id="findDemoBtn" class="secondary">
      FIND DEMO ACCOUNT
    </button>

    <div id="accountBox" class="accountBox">
      No account selected.
    </div>

    <label>Account ID</label>
    <input id="accountId" placeholder="Demo account ID">

    <label>Trading Symbol</label>
    <select id="symbol">
      <option value="1HZ100V">1HZ100V</option>
      <option value="1HZ75V">1HZ75V</option>
      <option value="1HZ50V">1HZ50V</option>
      <option value="1HZ25V">1HZ25V</option>
      <option value="1HZ10V">1HZ10V</option>
      <option value="R_100">R_100</option>
      <option value="R_75">R_75</option>
      <option value="R_50">R_50</option>
      <option value="R_25">R_25</option>
      <option value="R_10">R_10</option>
    </select>

    <label>Trading Mode</label>
    <select id="mode">
      <option value="matchdiff">MATCH + DIFFER</option>
      <option value="evenodd">EVEN + ODD</option>
    </select>

    <div class="grid">

      <div>
        <label>First Stake</label>
        <input id="stake1" type="number" value="0.50" min="0.35" step="0.01">
      </div>

      <div>
        <label>Second Stake</label>
        <input id="stake2" type="number" value="0.50" min="0.35" step="0.01">
      </div>

    </div>

    <button id="connectBtn">
      CONNECT
    </button>

    <div class="grid">
      <button id="startBtn" disabled>
        START BOT
      </button>

      <button id="stopBtn" class="danger" disabled>
        STOP BOT
      </button>
    </div>

    <div id="status" class="status">
      Disconnected
    </div>
  </div>


  <div class="card">

    <div class="statgrid">

      <div class="stat">
        <div class="stat-title">LAST DIGIT</div>
        <div id="lastDigit" class="stat-value">-</div>
      </div>

      <div class="stat">
        <div class="stat-title">SAMPLE</div>
        <div id="sampleCount" class="stat-value">0/10</div>
      </div>

      <div class="stat">
        <div class="stat-title">TOTAL P/L</div>
        <div id="totalPL" class="stat-value">$0.00</div>
      </div>

    </div>

    <div class="target">
      <div class="target-title">
        CURRENT TARGET
      </div>

      <div id="target" class="target-value">
        —
      </div>

      <div id="targetInfo" class="muted">
        Waiting for 10 fresh ticks
      </div>
    </div>

  </div>


  <div class="card">

    <h3>Current Pair</h3>

    <div class="grid">

      <div class="stat">
        <div class="stat-title">FIRST CONTRACT</div>
        <div id="leg1Status" class="stat-value">—</div>
      </div>

      <div class="stat">
        <div class="stat-title">SECOND CONTRACT</div>
        <div id="leg2Status" class="stat-value">—</div>
      </div>

    </div>

    <div class="status">
      Pair P/L:
      <strong id="pairPL">$0.00</strong>
    </div>

  </div>


  <div class="card">

    <h3>Activity</h3>

    <div id="log" class="log"></div>

  </div>


  <div class="signature">
    Built by NESTER
  </div>

</div>


<script>

const API_BASE = "https://api.derivws.com";

let ws = null;

let connected = false;
let running = false;

let reqId = 100;

let ticks = [];

let currentPair = null;

let totalPL = 0;

let accounts = [];

let pendingProposals = {};

let pendingBuys = {};

let contractWatchers = {};

let accountCurrency = "USD";


const $ = id => document.getElementById(id);


function log(message, type=""){

  const time = new Date().toLocaleTimeString();

  const div = document.createElement("div");

  div.className = type;

  div.textContent = `[${time}] ${message}`;

  $("log").appendChild(div);

  $("log").scrollTop = $("log").scrollHeight;
}


function setStatus(message){

  $("status").textContent = message;

}


function nextReq(){

  reqId++;

  return reqId;

}


function getPAT(){

  return $("pat").value.trim();

}


function getAppId(){

  return $("appId").value.trim();

}


function getAccountId(){

  return $("accountId").value.trim();

}


function getSymbol(){

  return $("symbol").value;

}


function getMode(){

  return $("mode").value;

}


function getStake1(){

  return Number($("stake1").value) || 0.50;

}


function getStake2(){

  return Number($("stake2").value) || 0.50;

}


/* =========================
   FIND DEMO ACCOUNT
========================= */

$("findDemoBtn").onclick = async () => {

  const pat = getPAT();
  const appId = getAppId();

  if(!pat){

    alert("Enter your PAT first.");

    return;
  }

  if(!appId){

    alert("Enter your App ID.");

    return;
  }

  $("findDemoBtn").disabled = true;

  $("accountBox").textContent = "Searching for demo accounts...";

  try{

    const response = await fetch(
      API_BASE + "/trading/v1/options/accounts",
      {
        method:"GET",

        headers:{
          "Authorization":"Bearer " + pat,
          "Deriv-App-ID":appId
        }
      }
    );

    const result = await response.json();

    if(!response.ok){

      throw new Error(
        result?.errors?.[0]?.message ||
        "Unable to retrieve accounts."
      );

    }

    const data = result.data;

    if(Array.isArray(data)){

      accounts = data;

    }else if(data){

      accounts = [data];

    }else{

      accounts = [];

    }

    const demoAccounts = accounts.filter(account => {

      const type =
        String(
          account.account_type ||
          account.type ||
          ""
        ).toLowerCase();

      return type.includes("demo") ||
             type.includes("virtual");

    });

    const selected =
      demoAccounts[0] ||
      accounts[0];

    if(!selected){

      throw new Error(
        "No Options account was returned."
      );

    }

    $("accountId").value =
      selected.account_id ||
      selected.id ||
      "";

    accountCurrency =
      selected.currency ||
      "USD";

    $("accountBox").innerHTML =
      `<strong>Selected:</strong> ${
        selected.account_id ||
        selected.id ||
        "Unknown"
      }<br>
      Type: ${
        selected.account_type ||
        selected.type ||
        "Unknown"
      }<br>
      Currency: ${
        selected.currency ||
        "USD"
      }`;

    log(
      "Demo account found: " +
      ($("accountId").value)
    );

  }catch(error){

    $("accountBox").textContent =
      "Error: " + error.message;

    log(
      "Account search error: " +
      error.message,
      "loss"
    );

  }finally{

    $("findDemoBtn").disabled = false;

  }

};


/* =========================
   CONNECT
========================= */

$("connectBtn").onclick = async () => {

  if(connected){

    disconnect();

    return;

  }

  const pat = getPAT();
  const appId = getAppId();
  const accountId = getAccountId();

  if(!pat){

    alert("Enter your PAT.");

    return;
  }

  if(!appId){

    alert("Enter your App ID.");

    return;
  }

  if(!accountId){

    alert("Find/select a demo account first.");

    return;
  }

  $("connectBtn").disabled = true;

  setStatus("Requesting secure WebSocket...");

  try{

    const response = await fetch(
      API_BASE +
      "/trading/v1/options/accounts/" +
      encodeURIComponent(accountId) +
      "/otp",
      {
        method:"POST",

        headers:{
          "Authorization":"Bearer " + pat,
          "Deriv-App-ID":appId
        }
      }
    );

    const result = await response.json();

    if(!response.ok){

      throw new Error(
        result?.errors?.[0]?.message ||
        "OTP request failed."
      );

    }

    const wsUrl = result?.data?.url;

    if(!wsUrl){

      throw new Error(
        "Deriv did not return a WebSocket URL."
      );

    }

    ws = new WebSocket(wsUrl);

    ws.onopen = () => {

      connected = true;

      $("connectBtn").textContent =
        "DISCONNECT";

      $("connectBtn").disabled = false;

      $("startBtn").disabled = false;

      setStatus("Connected");

      log("WebSocket connected.", "win");

      subscribeTicks();

    };

    ws.onmessage = event => {

      try{

        const data = JSON.parse(event.data);

        handleMessage(data);

      }catch(error){

        log(
          "Message parse error: " +
          error.message,
          "loss"
        );

      }

    };

    ws.onerror = () => {

      log(
        "WebSocket error.",
        "loss"
      );

    };

    ws.onclose = () => {

      connected = false;

      running = false;

      $("connectBtn").textContent =
        "CONNECT";

      $("connectBtn").disabled = false;

      $("startBtn").disabled = true;

      $("stopBtn").disabled = true;

      setStatus("Disconnected");

      log(
        "WebSocket disconnected.",
        "loss"
      );

    };

  }catch(error){

    $("connectBtn").disabled = false;

    setStatus("Connection failed");

    log(
      "Connection error: " +
      error.message,
      "loss"
    );

  }

};


/* =========================
   SUBSCRIBE TICKS
========================= */

function subscribeTicks(){

  if(!ws || ws.readyState !== WebSocket.OPEN){

    return;

  }

  ws.send(JSON.stringify({

    ticks:getSymbol(),

    subscribe:1,

    req_id:nextReq()

  }));

  log(
    "Subscribed to " +
    getSymbol()
  );

}


/* =========================
   START
========================= */

$("startBtn").onclick = () => {

  if(!connected){

    alert("Connect first.");

    return;
  }

  if(running){

    return;

  }

  running = true;

  ticks = [];

  currentPair = null;

  resetPairDisplay();

  $("startBtn").disabled = true;

  $("stopBtn").disabled = false;

  setStatus("BOT RUNNING — collecting 10 fresh ticks");

  $("target").textContent = "—";

  $("targetInfo").textContent =
    "Waiting for 10 fresh ticks";

  log(
    "BOT STARTED",
    "win"
  );

};


/* =========================
   STOP
========================= */

$("stopBtn").onclick = () => {

  running = false;

  currentPair = null;

  $("startBtn").disabled =
    !connected;

  $("stopBtn").disabled = true;

  setStatus(
    connected ?
    "Connected — bot stopped" :
    "Disconnected"
  );

  log(
    "BOT STOPPED"
  );

};


/* =========================
   DISCONNECT
========================= */

function disconnect(){

  running = false;

  if(ws){

    try{

      ws.close();

    }catch(e){}

  }

  ws = null;

  connected = false;

  $("connectBtn").textContent =
    "CONNECT";

  $("connectBtn").disabled = false;

  $("startBtn").disabled = true;

  $("stopBtn").disabled = true;

  setStatus("Disconnected");

  log("Disconnected.");

}


$("mode").onchange = () => {

  ticks = [];

  currentPair = null;

  resetPairDisplay();

  $("target").textContent = "—";

  $("targetInfo").textContent =
    "Waiting for 10 fresh ticks";

  if(running){

    log(
      "Mode changed. Collecting a new 10-tick sample."
    );

  }

};


/* =========================
   MESSAGE HANDLER
========================= */

function handleMessage(data){

  if(data.error){

    log(
      "API ERROR: " +
      (
        data.error.message ||
        "Unknown error"
      ),
      "loss"
    );

    handleAPIError(data);

    return;

  }


  if(data.msg_type === "tick"){

    handleTick(data);

    return;

  }


  if(data.msg_type === "proposal"){

    handleProposal(data);

    return;

  }


  if(data.msg_type === "buy"){

    handleBuy(data);

    return;

  }


  if(data.msg_type === "proposal_open_contract"){

    handleContract(data);

    return;

  }

}


/* =========================
   TICK DIGIT
========================= */

function getLastDigit(tick){

  const quote =
    Number(tick.quote);

  if(!Number.isFinite(quote)){

    return null;

  }

  let decimals = 2;

  const pip =
    Number(tick.pip_size);

  if(Number.isFinite(pip) && pip > 0){

    const s = pip.toString();

    if(s.includes(".")){

      decimals =
        s.split(".")[1]
         .replace(/0+$/,"")
         .length;

    }else{

      decimals = 0;

    }

  }

  const fixed =
    quote.toFixed(decimals);

  const digits =
    fixed.replace(/\D/g,"");

  if(!digits.length){

    return null;

  }

  return Number(
    digits.charAt(
      digits.length - 1
    )
  );

}


/* =========================
   TICK HANDLER
========================= */

function handleTick(data){

  const digit =
    getLastDigit(data.tick);

  if(digit === null){

    return;

  }

  $("lastDigit").textContent =
    digit;

  if(!running){

    return;

  }

  /*
    Do not collect data while a pair
    is currently being traded.
  */

  if(currentPair){

    return;

  }

  ticks.push(digit);

  if(ticks.length > 10){

    ticks.shift();

  }

  $("sampleCount").textContent =
    ticks.length + "/10";


  if(ticks.length < 10){

    $("targetInfo").textContent =
      "Collecting " +
      (10 - ticks.length) +
      " more tick" +
      ((10 - ticks.length) === 1 ? "" : "s");

    return;

  }


  createSignal();

}


/* =========================
   SIGNAL ENGINE
========================= */

function createSignal(){

  if(currentPair){

    return;

  }

  if(ticks.length < 10){

    return;

  }

  const mode =
    getMode();


  if(mode === "matchdiff"){

    const target =
      strongestDigit(ticks);

    const count =
      ticks.filter(
        d => d === target
      ).length;

    $("target").textContent =
      target;

    $("targetInfo").textContent =
      "MATCH " +
      target +
      " + DIFFER " +
      target +
      " • strength " +
      count +
      "/10";

    log(
      "SIGNAL: target digit = " +
      target +
      " (" +
      count +
      "/10)"
    );

    openMatchDiffer(
      target
    );

  }else{

    const parity =
      strongestParity(ticks);

    const count =
      ticks.filter(d =>
        parity === "EVEN"
        ? d % 2 === 0
        : d % 2 !== 0
      ).length;

    $("target").textContent =
      parity;

    $("targetInfo").textContent =
      "EVEN + ODD" +
      " • " +
      parity +
      " stronger " +
      count +
      "/10";

    log(
      "SIGNAL: " +
      parity +
      " (" +
      count +
      "/10)"
    );

    openEvenOdd(
      parity
    );

  }

}


/* =========================
   STRONGEST DIGIT
========================= */

function strongestDigit(list){

  const counts =
    Array(10).fill(0);

  list.forEach(d => {

    counts[d]++;

  });


  let best =
    0;

  let bestCount =
    counts[0];


  for(let d=1; d<=9; d++){

    if(counts[d] > bestCount){

      best = d;

      bestCount =
        counts[d];

    }

  }


  /*
    Tie-breaker:
    choose the most recent digit
    among the tied strongest digits.
  */

  const tied = [];

  for(let d=0; d<=9; d++){

    if(counts[d] === bestCount){

      tied.push(d);

    }

  }

  if(tied.length > 1){

    for(let i=list.length-1; i>=0; i--){

      if(tied.includes(list[i])){

        return list[i];

      }

    }

  }

  return best;

}


/* =========================
   STRONGEST PARITY
========================= */

function strongestParity(list){

  let even = 0;
  let odd = 0;

  list.forEach(d => {

    if(d % 2 === 0){

      even++;

    }else{

      odd++;

    }

  });


  if(even > odd){

    return "EVEN";

  }

  if(odd > even){

    return "ODD";

  }


  /*
    Tie:
    use the parity of the latest digit.
  */

  return list[list.length - 1] % 2 === 0
    ? "EVEN"
    : "ODD";

}


/* =========================
   CREATE PAIR
========================= */

function preparePair(){

  currentPair = {

    id:
      Date.now(),

    leg1:null,

    leg2:null,

    target:null,

    completed1:false,

    completed2:false,

    pl1:0,

    pl2:0

  };

  resetPairDisplay();

}


/* =========================
   MATCH + DIFFER
========================= */

function openMatchDiffer(target){

  preparePair();

  currentPair.target =
    target;

  currentPair.mode =
    "matchdiff";

  currentPair.leg1Type =
    "DIGITMATCH";

  currentPair.leg2Type =
    "DIGITDIFF";

  currentPair.leg1Name =
    "MATCH " + target;

  currentPair.leg2Name =
    "DIFFER " + target;

  pendingProposals = {};

  requestProposal(
    "MATCH",
    "DIGITMATCH",
    getStake1(),
    target
  );

  requestProposal(
    "DIFFER",
    "DIGITDIFF",
    getStake2(),
    target
  );

}


/* =========================
   EVEN + ODD
========================= */

function openEvenOdd(predicted){

  preparePair();

  currentPair.mode =
    "evenodd";

  currentPair.predicted =
    predicted;

  currentPair.leg1Type =
    "DIGITEVEN";

  currentPair.leg2Type =
    "DIGITODD";

  currentPair.leg1Name =
    "EVEN";

  currentPair.leg2Name =
    "ODD";

  pendingProposals = {};

  requestProposal(
    "EVEN",
    "DIGITEVEN",
    getStake1()
  );

  requestProposal(
    "ODD",
    "DIGITODD",
    getStake2()
  );

}


/* =========================
   PROPOSAL
========================= */

function requestProposal(
  leg,
  contractType,
  stake,
  target
){

  if(!ws ||
     ws.readyState !== WebSocket.OPEN){

    log(
      "Cannot request proposal: WebSocket closed.",
      "loss"
    );

    currentPair = null;

    return;

  }


  const id =
    nextReq();


  pendingProposals[id] =
    leg;


  const request = {

    proposal:1,

    amount:Number(stake),

    basis:"stake",

    contract_type:
      contractType,

    currency:
      accountCurrency || "USD",

    duration:1,

    duration_unit:"t",

    underlying_symbol:
      getSymbol(),

    passthrough:{

      bot:"NESTER_PAIRED_BOT",

      leg:leg,

      pair_id:
        currentPair.id

    },

    req_id:id

  };


  if(
    contractType === "DIGITMATCH" ||
    contractType === "DIGITDIFF"
  ){

    request.barrier =
      String(target);

  }


  ws.send(
    JSON.stringify(request)
  );


  log(
    "Proposal requested: " +
    leg
  );

}


/* =========================
   PROPOSAL RESPONSE
========================= */

function handleProposal(data){

  const leg =
    data?.echo_req?.passthrough?.leg ||
    pendingProposals[data.req_id];

  if(!leg){

    return;

  }

  const proposal =
    data.proposal;

  if(!proposal){

    log(
      "No proposal returned for " +
      leg,
      "loss"
    );

    currentPair = null;

    return;

  }


  if(!currentPair){

    return;

  }


  if(leg === "MATCH" ||
     leg === "EVEN"){

    currentPair.proposal1 =
      proposal;

    currentPair.leg1ProposalId =
      proposal.id;

    currentPair.leg1Ask =
      Number(
        proposal.ask_price
      );

  }else{

    currentPair.proposal2 =
      proposal;

    currentPair.leg2ProposalId =
      proposal.id;

    currentPair.leg2Ask =
      Number(
        proposal.ask_price
      );

  }


  log(
    leg +
    " proposal received: $" +
    Number(
      proposal.ask_price || 0
    ).toFixed(2)
  );


  if(
    currentPair.leg1ProposalId &&
    currentPair.leg2ProposalId
  ){

    buyBothImmediately();

  }

}


/* =========================
   BUY BOTH
========================= */

function buyBothImmediately(){

  if(!currentPair){

    return;

  }


  log(
    "Both proposals ready — sending paired buys.",
    "win"
  );


  /*
    JavaScript sends these two WebSocket
    messages consecutively. Deriv still
    treats them as two independent trades,
    not one atomic transaction.
  */

  sendBuy(
    "LEG1",
    currentPair.leg1ProposalId,
    currentPair.leg1Ask
  );

  sendBuy(
    "LEG2",
    currentPair.leg2ProposalId,
    currentPair.leg2Ask
  );

}


/* =========================
   BUY
========================= */

function sendBuy(
  leg,
  proposalId,
  price
){

  if(!ws ||
     ws.readyState !== WebSocket.OPEN){

    log(
      "Cannot buy " +
      leg +
      ": connection closed.",
      "loss"
    );

    return;

  }


  const id =
    nextReq();


  pendingBuys[id] =
    leg;


  ws.send(
    JSON.stringify({

      buy:proposalId,

      price:Number(price),

      passthrough:{

        bot:"NESTER_PAIRED_BOT",

        leg:leg,

        pair_id:
          currentPair.id

      },

      req_id:id

    })
  );


  log(
    "BUY SENT: " +
    leg
  );

}


/* =========================
   BUY RESPONSE
========================= */

function handleBuy(data){

  const leg =
    data?.echo_req?.passthrough?.leg ||
    pendingBuys[data.req_id];

  if(!leg){

    return;

  }


  if(data.error){

    log(
      "BUY FAILED " +
      leg +
      ": " +
      data.error.message,
      "loss"
    );

    if(currentPair){

      if(leg === "LEG1"){

        currentPair.completed1 = true;

      }else{

        currentPair.completed2 = true;

      }

      checkPairComplete();

    }

    return;

  }


  const buy =
    data.buy;

  if(!buy){

    return;

  }


  const contractId =
    buy.contract_id ||
    buy.transaction_id;


  log(
    "BUY CONFIRMED " +
    leg +
    " • contract " +
    contractId,
    "win"
  );


  if(!currentPair){

    return;

  }


  if(leg === "LEG1"){

    currentPair.contract1 =
      contractId;

    currentPair.buyPrice1 =
      Number(
        buy.buy_price || 0
      );

    $("leg1Status").textContent =
      currentPair.leg1Name ||
      "OPEN";

  }else{

    currentPair.contract2 =
      contractId;

    currentPair.buyPrice2 =
      Number(
        buy.buy_price || 0
      );

    $("leg2Status").textContent =
      currentPair.leg2Name ||
      "OPEN";

  }


  subscribeContract(
    leg,
    contractId
  );

}


/* =========================
   CONTRACT SUBSCRIPTION
========================= */

function subscribeContract(
  leg,
  contractId
){

  if(!contractId){

    return;

  }


  contractWatchers[
    contractId
  ] = leg;


  ws.send(
    JSON.stringify({

      proposal_open_contract:1,

      contract_id:
        contractId,

      subscribe:1,

      req_id:
        nextReq()

    })
  );


  log(
    "Watching " +
    leg +
    " contract..."
  );

}


/* =========================
   CONTRACT UPDATE
========================= */

function handleContract(data){

  const contract =
    data.proposal_open_contract;

  if(!contract){

    return;

  }


  const contractId =
    contract.contract_id;

  const leg =
    contractWatchers[
      contractId
    ];


  if(!leg){

    return;

  }


  const isSold =
    Number(contract.is_sold) === 1 ||
    contract.status === "sold";


  if(!isSold){

    return;

  }


  const profit =
    Number(
      contract.profit || 0
    );


  finishLeg(
    leg,
    profit,
    contract
  );

}


/* =========================
   FINISH LEG
========================= */

function finishLeg(
  leg,
  profit,
  contract
){

  if(!currentPair){

    return;

  }


  if(
    leg === "LEG1" &&
    currentPair.completed1
  ){

    return;

  }

  if(
    leg === "LEG2" &&
    currentPair.completed2
  ){

    return;

  }


  if(leg === "LEG1"){

    currentPair.completed1 =
      true;

    currentPair.pl1 =
      profit;

    setLegResult(
      $("leg1Status"),
      profit
    );

  }else{

    currentPair.completed2 =
      true;

    currentPair.pl2 =
      profit;

    setLegResult(
      $("leg2Status"),
      profit
    );

  }


  const pairPL =
    currentPair.pl1 +
    currentPair.pl2;


  $("pairPL").textContent =
    money(pairPL);


  log(
    leg +
    " SETTLED: " +
    (profit >= 0 ? "WIN" : "LOSS") +
    " • P/L " +
    money(profit),
    profit >= 0 ? "win" : "loss"
  );


  checkPairComplete();

}


/* =========================
   PAIR COMPLETE
========================= */

function checkPairComplete(){

  if(!currentPair){

    return;

  }


  const oneDone =
    currentPair.completed1;

  const twoDone =
    currentPair.completed2;


  if(!oneDone || !twoDone){

    return;

  }


  const pairPL =
    currentPair.pl1 +
    currentPair.pl2;


  totalPL +=
    pairPL;


  $("totalPL").textContent =
    money(totalPL);


  log(
    "PAIR COMPLETE • " +
    (pairPL >= 0 ? "NET WIN" : "NET LOSS") +
    " • " +
    money(pairPL),
    pairPL >= 0 ? "win" : "loss"
  );


  /*
    Clear the old sample so the next trade
    requires 10 completely fresh ticks.
  */

  ticks = [];

  $("sampleCount").textContent =
    "0/10";

  $("target").textContent =
    "—";

  $("targetInfo").textContent =
    "Waiting for 10 fresh ticks";


  currentPair = null;

  $("leg1Status").textContent =
    "—";

  $("leg2Status").textContent =
    "—";

  $("pairPL").textContent =
    "$0.00";


  if(running){

    setStatus(
      "BOT RUNNING — collecting 10 fresh ticks"
    );

  }

}


/* =========================
   RESULT DISPLAY
========================= */

function setLegResult(
  element,
  profit
){

  element.textContent =
    profit >= 0
      ? "WIN " + money(profit)
      : "LOSS " + money(profit);

  element.className =
    "stat-value " +
    (profit >= 0 ? "win" : "loss");

}


/* =========================
   RESET DISPLAY
========================= */

function resetPairDisplay(){

  $("leg1Status").textContent =
    "—";

  $("leg2Status").textContent =
    "—";

  $("leg1Status").className =
    "stat-value";

  $("leg2Status").className =
    "stat-value";

  $("pairPL").textContent =
    "$0.00";

}


/* =========================
   MONEY
========================= */

function money(value){

  const n =
    Number(value) || 0;

  return (
    n >= 0 ? "+" : ""
  ) +
  "$" +
  n.toFixed(2);

}


/* =========================
   API ERROR HANDLING
========================= */

function handleAPIError(data){

  if(!currentPair){

    return;

  }


  const req =
    data.echo_req || {};

  const leg =
    req?.passthrough?.leg;


  if(!leg){

    return;

  }


  if(
    leg === "LEG1" ||
    leg === "MATCH" ||
    leg === "EVEN"
  ){

    currentPair.completed1 =
      true;

    currentPair.pl1 = 0;

  }else{

    currentPair.completed2 =
      true;

    currentPair.pl2 = 0;

  }


  checkPairComplete();

}


/* =========================
   INITIAL LOG
========================= */

log(
  "NESTER Paired Digit Bot loaded."
);

log(
  "Select MATCH + DIFFER or EVEN + ODD."
);

log(
  "The bot requires 10 fresh ticks before each pair."
);

</script>
