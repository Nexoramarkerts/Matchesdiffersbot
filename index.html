<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PAIRTRADE AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#090511;
  color:#fff;
}
.header{
  background:#160b25;
  border-bottom:1px solid #442060;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font-size:20px;
  font-weight:bold;
  color:#c77dff;
}
.status{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
}
.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#777;
}
.dot.green{
  background:#21e66b;
  box-shadow:0 0 8px #21e66b;
}
.container{
  max-width:700px;
  margin:auto;
  padding:14px;
}
.card{
  background:#12091c;
  border:1px solid #3b1b53;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
}
.title{
  color:#c77dff;
  font-weight:bold;
  margin-bottom:10px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
label{
  display:block;
  font-size:11px;
  color:#aaa;
  margin-bottom:4px;
}
select,input,button{
  width:100%;
  border:1px solid #4c2167;
  background:#0c0612;
  color:white;
  border-radius:8px;
  padding:10px;
  font-size:13px;
}
button{
  background:#7926b7;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:#9639d8;
}
button.stop{
  background:#9b2638;
}
button.secondary{
  background:#30123f;
}
.row{
  display:flex;
  gap:8px;
}
.row>*{
  flex:1;
}
.big{
  font-size:18px;
  font-weight:bold;
}
.tickbox{
  max-height:130px;
  overflow:auto;
  background:#08040d;
  border-radius:8px;
  padding:8px;
  font-family:monospace;
  font-size:11px;
}
.stat{
  text-align:center;
  background:#0b0510;
  padding:10px;
  border-radius:8px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
.greenText{color:#21e66b}
.redText{color:#ff4d6d}
.purpleText{color:#c77dff}
.small{
  font-size:10px;
  color:#888;
  margin-top:5px;
}
.hidden{display:none}
</style>
</head>

<body>

<div class="header">
  <div class="logo">PAIRTRADE AI</div>
  <div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">DISCONNECTED</span>
  </div>
</div>

<div class="container">

  <!-- CONNECTION -->
  <div class="card">
    <div class="title">DERIV CONNECTION</div>

    <div class="grid">
      <div>
        <label>APP ID</label>
        <input id="appId" placeholder="Enter App ID">
      </div>

      <div>
        <label>PAT</label>
        <input id="pat" type="password" placeholder="Enter PAT">
      </div>
    </div>

    <br>

    <div class="row">
      <button onclick="connectAccount()">CONNECT</button>
      <button class="secondary" onclick="findDemo()">FIND DEMO</button>
      <button class="secondary" onclick="findReal()">FIND REAL</button>
    </div>

    <div id="connectionMessage" class="small"></div>
  </div>


  <!-- ACCOUNT -->
  <div class="card">
    <div class="title">ACCOUNT</div>

    <div class="grid">
      <div>
        <label>ACCOUNT</label>
        <div id="accountId" class="big">—</div>
      </div>

      <div>
        <label>BALANCE</label>
        <div id="balance" class="big">$0.00</div>
      </div>
    </div>
  </div>


  <!-- MARKET -->
  <div class="card">
    <div class="title">MARKET</div>

    <div class="grid">

      <div>
        <label>MARKET</label>
        <select id="market">
          <option value="volatility">Volatilities</option>
          <option value="volatility1s">Volatility 1s</option>
        </select>
      </div>

      <div>
        <label>SYMBOL</label>
        <select id="symbol">
          <option value="">Loading symbols...</option>
        </select>
      </div>

    </div>

    <div class="small">
      Real Deriv symbols are loaded automatically from active_symbols.
    </div>
  </div>


  <!-- CONTRACT -->
  <div class="card">
    <div class="title">TRADE TYPE</div>

    <div class="grid">

      <div>
        <label>TRADE TYPE</label>
        <select id="tradeType">
          <option value="digits">Digits</option>
          <option value="updown">Up / Down</option>
        </select>
      </div>

      <div>
        <label>PAIR</label>
        <select id="pairType">
          <option value="matchdiff">Matches / Differs</option>
          <option value="evenodd">Even / Odd</option>
          <option value="overunder">Over / Under</option>
          <option value="updown">Rise / Fall</option>
        </select>
      </div>

    </div>

    <br>

    <div id="digitSettings">

      <div class="grid">

        <div>
          <label>AUTO BARRIER</label>
          <select id="autoBarrier">
            <option value="on">ON</option>
            <option value="off">OFF</option>
          </select>
        </div>

        <div>
          <label>MANUAL MATCH BARRIER</label>
          <input id="matchBarrier" type="number" min="0" max="9" value="5">
        </div>

      </div>

      <br>

      <div id="overUnderSettings">

        <div class="grid">

          <div>
            <label>UNDER BARRIER</label>
            <input id="underBarrier" type="number" min="0" max="9" value="6">
          </div>

          <div>
            <label>OVER BARRIER</label>
            <input id="overBarrier" type="number" min="0" max="9" value="3">
          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- TRADING -->
  <div class="card">
    <div class="title">TRADING SETTINGS</div>

    <div class="grid">

      <div>
        <label>STAKE / LEG</label>
        <input id="stake" type="number" min="0.35" step="0.01" value="0.50">
      </div>

      <div>
        <label>DURATION / TICKS</label>
        <input id="duration" type="number" min="1" max="100" value="1">
      </div>

      <div>
        <label>LOOKBACK TICKS</label>
        <input id="lookback" type="number" min="5" max="100" value="25">
      </div>

      <div>
        <label>MIN STRENGTH %</label>
        <input id="strength" type="number" min="1" max="100" value="15">
      </div>

    </div>

    <br>

    <div class="row">
      <button onclick="startBot()">START</button>
      <button class="stop" onclick="stopBot()">STOP</button>
      <button class="secondary" onclick="resetRuns()">RESET RUNS</button>
    </div>
  </div>


  <!-- STATS -->
  <div class="card">
    <div class="title">RUNS</div>

    <div class="stats">

      <div class="stat">
        <label>RUNS</label>
        <div id="runs" class="purpleText">0</div>
      </div>

      <div class="stat">
        <label>WINS</label>
        <div id="wins" class="greenText">0</div>
      </div>

      <div class="stat">
        <label>LOSSES</label>
        <div id="losses" class="redText">0</div>
      </div>

      <div class="stat">
        <label>WIN RATE</label>
        <div id="winrate">0%</div>
      </div>

    </div>
  </div>


  <!-- LIVE -->
  <div class="card">

    <div class="title">LIVE TICKS</div>

    <div>
      <label>CURRENT DIGIT</label>
      <div id="currentDigit" class="big purpleText">—</div>
    </div>

    <br>

    <div>
      <label>ANALYSIS</label>
      <div id="analysis">Waiting for ticks...</div>
    </div>

    <br>

    <div id="tickList" class="tickbox">
      Waiting for Deriv connection...
    </div>

  </div>


  <!-- LOG -->
  <div class="card">
    <div class="title">ACTIVITY</div>
    <div id="log" class="tickbox"></div>
  </div>

</div>


<script>

let ws = null;
let appID = "";
let PAT = "";
let selectedAccount = null;

let symbols = [];
let ticks = [];
let running = false;

let runs = 0;
let wins = 0;
let losses = 0;

let reqCounter = 100;

const $ = id => document.getElementById(id);

function log(msg){
  const box = $("log");
  const time = new Date().toLocaleTimeString();
  box.innerHTML =
    `[${time}] ${msg}<br>` + box.innerHTML;
}

function setStatus(connected){
  $("statusDot").className =
    connected ? "dot green" : "dot";

  $("statusText").textContent =
    connected ? "CONNECTED" : "DISCONNECTED";
}


/* ---------------------------------------------------
   DERIV ACCOUNT CONNECTION
--------------------------------------------------- */

async function connectAccount(){

  appID = $("appId").value.trim();
  PAT = $("pat").value.trim();

  if(!appID || !PAT){
    $("connectionMessage").textContent =
      "Enter App ID and PAT first.";
    return;
  }

  $("connectionMessage").textContent =
    "Finding Deriv accounts...";

  try{

    const response = await fetch(
      "https://api.derivws.com/trading/v1/options/accounts",
      {
        headers:{
          "Authorization":"Bearer " + PAT,
          "Deriv-App-ID":appID
        }
      }
    );

    const json = await response.json();

    if(!response.ok){
      throw new Error(
        json.message || "Unable to get accounts"
      );
    }

    const accounts =
      json.data ||
      json.accounts ||
      [];

    if(!accounts.length){
      throw new Error("No Deriv accounts found.");
    }

    selectedAccount =
      accounts.find(a =>
        String(a.account_type || a.type || "")
        .toLowerCase()
        .includes("demo")
      ) || accounts[0];

    await openOTP(selectedAccount);

  }catch(error){

    $("connectionMessage").textContent =
      error.message;

    log("Connection error: " + error.message);
  }
}


async function findDemo(){

  appID = $("appId").value.trim();
  PAT = $("pat").value.trim();

  if(!appID || !PAT){
    alert("Enter App ID and PAT first.");
    return;
  }

  await findAccountType("demo");
}


async function findReal(){

  appID = $("appId").value.trim();
  PAT = $("pat").value.trim();

  if(!appID || !PAT){
    alert("Enter App ID and PAT first.");
    return;
  }

  await findAccountType("real");
}


async function findAccountType(type){

  $("connectionMessage").textContent =
    "Searching for " + type + " account...";

  try{

    const response = await fetch(
      "https://api.derivws.com/trading/v1/options/accounts",
      {
        headers:{
          "Authorization":"Bearer " + PAT,
          "Deriv-App-ID":appID
        }
      }
    );

    const json = await response.json();

    if(!response.ok){
      throw new Error(
        json.message || "Account lookup failed"
      );
    }

    const accounts =
      json.data ||
      json.accounts ||
      [];

    selectedAccount = accounts.find(a => {

      const value =
        String(
          a.account_type ||
          a.type ||
          a.environment ||
          ""
        ).toLowerCase();

      return value.includes(type);

    });

    if(!selectedAccount){

      throw new Error(
        "No " + type + " account found."
      );

    }

    await openOTP(selectedAccount);

  }catch(error){

    $("connectionMessage").textContent =
      error.message;

    log(error.message);
  }
}


async function openOTP(account){

  try{

    const accountId =
      account.id ||
      account.account_id ||
      account.loginid;

    if(!accountId){
      throw new Error("Account ID missing.");
    }

    $("connectionMessage").textContent =
      "Creating secure Deriv connection...";

    const response = await fetch(
      "https://api.derivws.com/trading/v1/options/accounts/" +
      encodeURIComponent(accountId) +
      "/otp",
      {
        method:"POST",
        headers:{
          "Authorization":"Bearer " + PAT,
          "Deriv-App-ID":appID,
          "Content-Type":"application/json"
        }
      }
    );

    const json = await response.json();

    if(!response.ok){
      throw new Error(
        json.message || "OTP connection failed"
      );
    }

    const url =
      json.data?.url ||
      json.url;

    if(!url){
      throw new Error("WebSocket URL missing.");
    }

    selectedAccount = account;

    connectWebSocket(
      url,
      accountId
    );

  }catch(error){

    $("connectionMessage").textContent =
      error.message;

    log(error.message);
  }
}


/* ---------------------------------------------------
   WEBSOCKET
--------------------------------------------------- */

function connectWebSocket(url, accountId){

  if(ws){
    try{ ws.close(); }catch(e){}
  }

  $("connectionMessage").textContent =
    "Connecting...";

  ws = new WebSocket(url);

  ws.onopen = () => {

    setStatus(true);

    $("connectionMessage").textContent =
      "Deriv connection active.";

    $("accountId").textContent =
      accountId;

    log("Connected to Deriv.");

    /*
      IMPORTANT:
      New Deriv active_symbols uses:
      underlying_symbol
      underlying_symbol_name
    */

    ws.send(JSON.stringify({
      active_symbols:"brief",
      req_id:++reqCounter
    }));

    /*
      Balance
    */
    ws.send(JSON.stringify({
      balance:1,
      subscribe:1,
      req_id:++reqCounter
    }));
  };


  ws.onmessage = event => {

    try{

      const data =
        JSON.parse(event.data);

      handleMessage(data);

    }catch(error){

      console.error(error);

    }

  };


  ws.onerror = () => {

    setStatus(false);

    $("connectionMessage").textContent =
      "WebSocket error.";

    log("WebSocket error.");

  };


  ws.onclose = () => {

    setStatus(false);

    $("connectionMessage").textContent =
      "Disconnected.";

    log("Disconnected from Deriv.");

  };
}


/* ---------------------------------------------------
   MESSAGE HANDLER
--------------------------------------------------- */

function handleMessage(data){

  if(data.error){

    log(
      "DERIV ERROR: " +
      (
        data.error.message ||
        "Unknown error"
      )
    );

    return;
  }


  /* ACTIVE SYMBOLS */

  if(data.msg_type === "active_symbols"){

    loadSymbols(
      data.active_symbols || []
    );

    return;
  }


  /* BALANCE */

  if(data.msg_type === "balance"){

    const balance =
      data.balance?.balance;

    if(balance !== undefined){

      $("balance").textContent =
        Number(balance).toFixed(2) +
        " " +
        (data.balance.currency || "USD");

    }

    return;
  }


  /* TICKS */

  if(data.msg_type === "tick"){

    processTick(data.tick);

    return;
  }


  if(data.msg_type === "contracts_for"){

    log("Contract availability received.");

    return;
  }

}


/* ---------------------------------------------------
   SYMBOL LOADING
--------------------------------------------------- */

function loadSymbols(list){

  symbols = list || [];

  const market =
    $("market").value;

  const select =
    $("symbol");

  select.innerHTML = "";

  let filtered = symbols.filter(s => {

    /*
      NEW API
    */
    const code =
      s.underlying_symbol ||
      s.symbol ||
      "";

    /*
      New API symbol type/name
    */
    const name =
      s.underlying_symbol_name ||
      s.display_name ||
      "";

    /*
      Accept both current and legacy response formats.
    */
    const text =
      (name + " " + code)
      .toLowerCase();

    if(market === "volatility"){

      return (
        text.includes("volatility") &&
        !text.includes("(1s)") &&
        !text.includes("1s") &&
        !code.startsWith("1HZ")
      );

    }

    if(market === "volatility1s"){

      return (
        text.includes("volatility") &&
        (
          text.includes("1s") ||
          code.startsWith("1HZ")
        )
      );

    }

    return false;

  });


  /*
    Sort by volatility number.
  */
  filtered.sort((a,b)=>{

    const ac =
      a.underlying_symbol ||
      a.symbol ||
      "";

    const bc =
      b.underlying_symbol ||
      b.symbol ||
      "";

    const an =
      parseInt(
        (ac.match(/\d+/)||["999"])[0]
      );

    const bn =
      parseInt(
        (bc.match(/\d+/)||["999"])[0]
      );

    return an-bn;

  });


  /*
    Remove duplicates.
  */
  const unique = [];

  const seen = new Set();

  filtered.forEach(s=>{

    const code =
      s.underlying_symbol ||
      s.symbol;

    if(!code || seen.has(code))
      return;

    seen.add(code);

    unique.push(s);

  });


  /*
    If no symbols were returned because of
    an API field/version difference, use
    the known volatility symbol codes as
    a fallback.
  */
  if(unique.length === 0){

    if(market === "volatility"){

      addFallbackSymbols([
        ["R_10","Volatility 10"],
        ["R_25","Volatility 25"],
        ["R_50","Volatility 50"],
        ["R_75","Volatility 75"],
        ["R_100","Volatility 100"]
      ]);

    }else{

      addFallbackSymbols([
        ["1HZ10V","Volatility 10 1s"],
        ["1HZ25V","Volatility 25 1s"],
        ["1HZ50V","Volatility 50 1s"],
        ["1HZ75V","Volatility 75 1s"],
        ["1HZ100V","Volatility 100 1s"]
      ]);

    }

    log(
      "Using volatility symbol fallback list."
    );

    return;
  }


  unique.forEach(s=>{

    const code =
      s.underlying_symbol ||
      s.symbol;

    const rawName =
      s.underlying_symbol_name ||
      s.display_name ||
      code;

    const option =
      document.createElement("option");

    option.value = code;

    option.textContent =
      cleanVolatilityName(
        rawName,
        code
      );

    select.appendChild(option);

  });


  log(
    unique.length +
    " volatility symbols loaded."
  );


  /*
    Start ticks for first symbol.
  */
  if(select.value){

    subscribeTicks(
      select.value
    );

    requestContractsFor(
      select.value
    );

  }

}


/* ---------------------------------------------------
   FALLBACK SYMBOLS
--------------------------------------------------- */

function addFallbackSymbols(list){

  const select =
    $("symbol");

  select.innerHTML = "";

  list.forEach(item=>{

    const option =
      document.createElement("option");

    option.value =
      item[0];

    option.textContent =
      item[1];

    select.appendChild(option);

  });

}


/* ---------------------------------------------------
   CLEAN DISPLAY NAMES
--------------------------------------------------- */

function cleanVolatilityName(name,code){

  const text =
    String(name || "").toLowerCase();

  /*
    Check 100 BEFORE 10 so
    Volatility 100 never becomes
    Volatility 10.
  */

  if(code === "R_100")
    return "Volatility 100";

  if(code === "R_75")
    return "Volatility 75";

  if(code === "R_50")
    return "Volatility 50";

  if(code === "R_25")
    return "Volatility 25";

  if(code === "R_10")
    return "Volatility 10";


  if(code === "1HZ100V")
    return "Volatility 100 1s";

  if(code === "1HZ90V")
    return "Volatility 90 1s";

  if(code === "1HZ75V")
    return "Volatility 75 1s";

  if(code === "1HZ50V")
    return "Volatility 50 1s";

  if(code === "1HZ30V")
    return "Volatility 30 1s";

  if(code === "1HZ25V")
    return "Volatility 25 1s";

  if(code === "1HZ15V")
    return "Volatility 15 1s";

  if(code === "1HZ10V")
    return "Volatility 10 1s";


  return name || code;
}


/* ---------------------------------------------------
   MARKET CHANGE
--------------------------------------------------- */

$("market").addEventListener(
  "change",
  ()=>{

    ticks = [];

    $("currentDigit").textContent = "—";

    $("analysis").textContent =
      "Loading volatility symbols...";

    /*
      Re-request active symbols.
    */

    if(ws && ws.readyState === WebSocket.OPEN){

      ws.send(JSON.stringify({
        active_symbols:"brief",
        req_id:++reqCounter
      }));

    }

  }
);


/* ---------------------------------------------------
   SYMBOL CHANGE
--------------------------------------------------- */

$("symbol").addEventListener(
  "change",
  ()=>{

    ticks = [];

    const symbol =
      $("symbol").value;

    if(symbol){

      subscribeTicks(symbol);

      requestContractsFor(symbol);

    }

  }
);


/* ---------------------------------------------------
   TICKS
--------------------------------------------------- */

function subscribeTicks(symbol){

  if(!ws ||
     ws.readyState !== WebSocket.OPEN)
    return;

  /*
    Subscribe to real-time ticks.
  */

  ws.send(JSON.stringify({
    ticks:symbol,
    subscribe:1,
    req_id:++reqCounter
  }));

  log(
    "Subscribed to " + symbol
  );
}


function processTick(tick){

  if(!tick) return;

  const quote =
    Number(tick.quote);

  const digit =
    lastDigit(quote);

  ticks.push({
    quote:quote,
    digit:digit,
    epoch:tick.epoch
  });

  const lookback =
    Number($("lookback").value) || 25;

  if(ticks.length > lookback)
    ticks.shift();

  $("currentDigit").textContent =
    digit;

  updateTickDisplay();

  analyzeTicks();
}


function lastDigit(price){

  const str =
    String(price);

  const digits =
    str.replace(/\D/g,"");

  return Number(
    digits.charAt(
      digits.length - 1
    )
  );
}


function updateTickDisplay(){

  $("tickList").innerHTML =
    ticks
      .slice()
      .reverse()
      .map(t =>
        `${t.digit}  |  ${t.quote}`
      )
      .join("<br>");
}


/* ---------------------------------------------------
   ANALYSIS
--------------------------------------------------- */

function analyzeTicks(){

  if(ticks.length < 5){

    $("analysis").textContent =
      "Collecting ticks...";

    return null;
  }

  const counts =
    Array(10).fill(0);

  ticks.forEach(t=>{
    counts[t.digit]++;
  });

  let bestDigit = 0;

  for(let i=1;i<10;i++){

    if(
      counts[i] >
      counts[bestDigit]
    ){

      bestDigit = i;

    }

  }

  const strength =
    (counts[bestDigit] /
    ticks.length) * 100;

  $("analysis").innerHTML =
    `Dominant digit: <b>${bestDigit}</b>
     | Strength: <b>${strength.toFixed(1)}%</b>
     | Samples: <b>${ticks.length}</b>`;

  return {
    digit:bestDigit,
    strength:strength
  };
}


/* ---------------------------------------------------
   CONTRACTS FOR SYMBOL
--------------------------------------------------- */

function requestContractsFor(symbol){

  if(!ws ||
     ws.readyState !== WebSocket.OPEN)
    return;

  ws.send(JSON.stringify({
    contracts_for:symbol,
    req_id:++reqCounter
  }));

}


/* ---------------------------------------------------
   BOT
--------------------------------------------------- */

function startBot(){

  if(!ws ||
     ws.readyState !== WebSocket.OPEN){

    alert(
      "Connect to Deriv first."
    );

    return;
  }

  running = true;

  log("BOT STARTED.");

}


function stopBot(){

  running = false;

  log("BOT STOPPED.");

}


function resetRuns(){

  runs = 0;
  wins = 0;
  losses = 0;

  updateStats();

  log("Runs reset.");

}


function updateStats(){

  $("runs").textContent =
    runs;

  $("wins").textContent =
    wins;

  $("losses").textContent =
    losses;

  const rate =
    runs > 0
      ? (wins/runs)*100
      : 0;

  $("winrate").textContent =
    rate.toFixed(1) + "%";
}


/* ---------------------------------------------------
   PAIR TYPE UI
--------------------------------------------------- */

$("pairType").addEventListener(
  "change",
  ()=>{

    const pair =
      $("pairType").value;

    if(pair === "overunder"){

      $("autoBarrier").value =
        "off";

      $("overUnderSettings")
        .classList.remove("hidden");

    }else{

      $("overUnderSettings")
        .classList.remove("hidden");

    }

  }
);


/* ---------------------------------------------------
   AUTO BARRIER
--------------------------------------------------- */

$("autoBarrier").addEventListener(
  "change",
  ()=>{
    analyzeTicks();
  }
);


/* ---------------------------------------------------
   INITIAL UI
--------------------------------------------------- */

updateStats();

$("symbol").innerHTML =
  '<option value="">Connect to Deriv first</option>';

</script>

</body>
</html>
