<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paireu Digit Bot Terminal</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        derivDark: '#0e1622',
                        derivCard: '#152030',
                        derivInput: '#0b1018',
                        derivBlue: '#1a73e8',
                        derivDisconnect: '#d93025'
                    }
                }
            }
        }
    </script>
    <!-- Google Inter Font -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0e1622; }
    </style>
</head>
<body class="text-gray-200 min-h-screen p-4 lg:p-6 flex flex-col justify-center items-center">

    <!-- Premium Dashboard Grid Frame Container -->
    <div class="max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        
        <!-- ================= LEFT SIDE PANEL: CREDENTIAL NODE ================= -->
        <div class="bg-derivCard p-6 rounded-2xl border border-gray-800 shadow-xl space-y-5">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">Paireu Digit Bot</h1>
                <p class="text-xs text-gray-400 mt-1">Match/Differ + Even/Odd • 1 Tick</p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Deriv App ID</label>
                <input type="text" value="34vl680tGB2gqo6WEMsRZ" class="w-full bg-derivInput border border-gray-800 rounded-xl px-4 py-3 text-sm font-mono text-gray-200 focus:outline-none focus:border-derivBlue transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Personal Access Token (PAT)</label>
                <input type="password" value="••••••••••••••••••••••••••••••••••••••••" class="w-full bg-derivInput border border-gray-800 rounded-xl px-4 py-3 text-sm font-mono text-gray-200 focus:outline-none focus:border-derivBlue transition-all">
            </div>

            <div class="space-y-3 pt-2">
                <button class="w-full bg-derivCard hover:bg-gray-800 text-white border border-gray-700 font-semibold py-3 px-4 rounded-xl text-sm transition-all active:scale-[0.98]">
                    FIND DEMO ACCOUNT
                </button>
                <button class="w-full bg-derivCard hover:bg-gray-800 text-white border border-gray-700 font-semibold py-3 px-4 rounded-xl text-sm transition-all active:scale-[0.98]">
                    FIND REAL ACCOUNT
                </button>
            </div>
        </div>

        <!-- ================= CENTER MAIN PANEL: RUNTIME STATUS ================= -->
        <div class="bg-derivCard p-6 rounded-2xl border border-gray-800 shadow-xl space-y-5">
            <div class="bg-derivInput p-4 rounded-xl border border-gray-800/80">
                <div class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Selected DEMO Account ID</div>
                <div class="text-lg font-bold font-mono tracking-tight text-white">DOT92743858</div>
                <div class="text-xs font-semibold text-gray-500 mt-1">Currency Portfolio Target: <span class="text-derivBlue font-bold">USD</span></div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Account ID Field Mapping</label>
                <input type="text" value="DOT92743858" class="w-full bg-derivInput border border-gray-800 rounded-xl px-4 py-3 text-sm font-mono text-gray-200 focus:outline-none focus:border-derivBlue transition-all">
            </div>
        </div>

        <!-- ================= RIGHT SIDE PANEL: CONFIG & EXECUTION ================= -->
        <div class="bg-derivCard p-6 rounded-2xl border border-gray-800 shadow-xl space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Trading Symbol</label>
                <select class="w-full bg-derivInput border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-derivBlue transition-all cursor-pointer appearance-none">
                    <option>1HZ100V</option>
                    <option>Volatility 75 Index</option>
                    <option>Volatility 50 Index</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Trading Mode</label>
                <select class="w-full bg-derivInput border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-derivBlue transition-all cursor-pointer appearance-none">
                    <option>MATCH + DIFFER</option>
                    <option>EVEN + ODD</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">First Stake</label>
                    <input type="text" value="0.50" class="w-full bg-derivInput border border-gray-800 rounded-xl px-4 py-3 text-sm font-bold text-white text-center focus:outline-none focus:border-derivBlue transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Second Stake</label>
                    <input type="text" value="0.50" class="w-full bg-derivInput border border-gray-800 rounded-xl px-4 py-3 text-sm font-bold text-white text-center focus:outline-none focus:border-derivBlue transition-all">
                </div>
            </div>

            <div class="pt-4">
                <button class="w-full bg-derivDisconnect hover:bg-red-700 text-white font-bold tracking-wider py-4 px-6 rounded-xl text-sm transition-all active:scale-[0.99] shadow-lg shadow-red-900/20">
                    DISCONNECT
                </button>
            </div>
        </div>

    </div>

</body>
</html>
